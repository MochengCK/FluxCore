name: build

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04
            arch: arm64
    steps:
    - uses: actions/checkout@v6
    - name: Detect source directory
      run: |
        if [ -f "configure.ac" ] && [ -d "src" ]; then
          echo "FLUXCORE_DIR=." >> $GITHUB_ENV
        elif [ -f "FluxCore/configure.ac" ] && [ -d "FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore" >> $GITHUB_ENV
        elif [ -f "FluxCore/FluxCore/configure.ac" ] && [ -d "FluxCore/FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore/FluxCore" >> $GITHUB_ENV
        else
          exit 1
        fi
    - name: Linux setup
      run: |
        sudo apt-get update --allow-releaseinfo-change
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          sudo apt-get install \
            g++-12 \
            autoconf \
            automake \
            autotools-dev \
            autopoint \
            gettext \
            gettext-base \
            xz-utils \
            libtool \
            pkgconf \
            libssl-dev \
            libc-ares-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssh2-1-dev \
            libexpat1-dev
        else
          sudo apt-get install \
            g++-12 \
            autoconf \
            automake \
            autotools-dev \
            autopoint \
            gettext \
            gettext-base \
            xz-utils \
            libtool \
            pkg-config \
            libssl-dev \
            libc-ares-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssh2-1-dev \
            libexpat1-dev
        fi
    - name: Autoreconf
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        rm -rf autom4te.cache
        rm -f configure
        export ACLOCAL_PATH="$(pwd)/m4"
        aclocal -I m4
        if [ ! -f /usr/share/gettext/archive.dir.tar.xz ] && [ -f /usr/share/gettext/archive.dir.tar.gz ]; then
          tmpdir="$(mktemp -d)"
          sudo tar -xzf /usr/share/gettext/archive.dir.tar.gz -C "$tmpdir"
          sudo tar -cJf /usr/share/gettext/archive.dir.tar.xz -C "$tmpdir" .
          sudo rm -rf "$tmpdir"
        fi
        if [ ! -f /usr/share/gettext/archive.dir.tar.xz ]; then
          sudo apt-get update
          sudo apt-get install -y gettext
        fi
        autopoint --force
        AUTOPOINT=true autoreconf -fi -I m4
    - name: Verify configure
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        if grep -n "ARIA2_ARG_WITH" configure; then
          exit 1
        fi
    - name: Configure
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          export CC=gcc
          export CXX=g++
          HOST_FLAG=""
        else
          HOST_FLAG=""
        fi
        ./configure $HOST_FLAG \
          --with-openssl \
          --without-gnutls \
          --with-libcares \
          --with-libssh2 \
          --with-sqlite3 \
          --with-libexpat \
          --without-libxml2 \
          --disable-nls
    - name: Build
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        make -j"$(nproc)"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FluxCore-linux-${{ matrix.arch }}
        path: ${{ env.FLUXCORE_DIR }}/src/aria2c

  build-macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: x64
          - runner: macos-14
            arch: arm64
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Detect source directory
      run: |
        if [ -f "configure.ac" ] && [ -d "src" ]; then
          echo "FLUXCORE_DIR=." >> $GITHUB_ENV
        elif [ -f "FluxCore/configure.ac" ] && [ -d "FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore" >> $GITHUB_ENV
        elif [ -f "FluxCore/FluxCore/configure.ac" ] && [ -d "FluxCore/FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore/FluxCore" >> $GITHUB_ENV
        else
          exit 1
        fi
    - name: MacOS setup
      run: |
        brew install gettext openssl libssh2 c-ares sqlite3 \
          autoconf automake pkg-config libtool expat
    - name: MacOS gettext path
      run: |
        echo "$(brew --prefix gettext)/bin" >> $GITHUB_PATH
    - name: Autoreconf
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        rm -rf autom4te.cache
        rm -f configure
        export ACLOCAL_PATH="$(pwd)/m4"
        aclocal -I m4
        autopoint --force
        autoreconf -fi -I m4
    - name: Verify configure
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        if grep -n "ARIA2_ARG_WITH" configure; then
          exit 1
        fi
    - name: Configure
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        ./configure \
          --without-openssl --without-gnutls --with-appletls \
          --with-libcares \
          --with-libssh2 \
          --with-sqlite3 \
          --with-libexpat \
          --without-libxml2 \
          --disable-nls
    - name: Build
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        make -j"$(sysctl -n hw.ncpu)"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FluxCore-macos-${{ matrix.arch }}
        path: ${{ env.FLUXCORE_DIR }}/src/aria2c

  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msystem: MINGW64
            mingw_dir: mingw64
            host: x86_64-w64-mingw32
            packages: >-
              mingw-w64-x86_64-toolchain
              autoconf
              automake
              libtool
              pkg-config
              make
              gettext
              gettext-devel
              xz
              mingw-w64-x86_64-openssl
              mingw-w64-x86_64-libssh2
              mingw-w64-x86_64-c-ares
              mingw-w64-x86_64-sqlite3
              mingw-w64-x86_64-expat
              mingw-w64-x86_64-gmp
              mingw-w64-x86_64-zlib
    steps:
    - uses: actions/checkout@v6
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: true
        install: ${{ matrix.packages }}
    - name: Detect source directory
      shell: msys2 {0}
      run: |
        if [ -f "configure.ac" ] && [ -d "src" ]; then
          echo "FLUXCORE_DIR=." >> $GITHUB_ENV
        elif [ -f "FluxCore/configure.ac" ] && [ -d "FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore" >> $GITHUB_ENV
        elif [ -f "FluxCore/FluxCore/configure.ac" ] && [ -d "FluxCore/FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore/FluxCore" >> $GITHUB_ENV
        else
          exit 1
        fi
    - name: Autoreconf
      shell: msys2 {0}
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        rm -rf autom4te.cache
        rm -f configure
        export ACLOCAL_PATH="$(pwd)/m4"
        aclocal -I m4
        if [ ! -f ./config.rpath ] && [ -f /usr/share/gettext/config.rpath ]; then
          cp /usr/share/gettext/config.rpath ./config.rpath
        fi
        if [ ! -f ./config.rpath ]; then
          ap="$(command -v autopoint || true)"
          if [ -n "$ap" ]; then
            p="$(cd "$(dirname "$ap")/.." && pwd)/share/gettext/config.rpath"
            if [ -f "$p" ]; then
              cp "$p" ./config.rpath
            fi
          fi
        fi
        autoreconf -fi -I m4
    - name: Verify configure
      shell: msys2 {0}
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        if grep -n "ARIA2_ARG_WITH" configure; then
          exit 1
        fi
    - name: Configure
      shell: msys2 {0}
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        ./configure \
          --host=${{ matrix.host }} \
          --without-included-gettext \
          --disable-nls \
          --with-libcares \
          --without-gnutls \
          --without-wintls \
          --with-openssl \
          --with-sqlite3 \
          --without-libxml2 \
          --with-libexpat \
          --with-libz \
          --with-libgmp \
          --with-libssh2 \
          --without-libgcrypt \
          --without-libnettle \
          --disable-dependency-tracking \
          ARIA2_STATIC=yes \
          CPPFLAGS="-I/${{ matrix.mingw_dir }}/include" \
          LDFLAGS="-L/${{ matrix.mingw_dir }}/lib" \
          LIBS="-lcrypt32" \
          PKG_CONFIG_PATH="/${{ matrix.mingw_dir }}/lib/pkgconfig"
    - name: Build
      shell: msys2 {0}
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        make -j"$(nproc)"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FluxCore-windows-${{ matrix.arch }}
        path: ${{ env.FLUXCORE_DIR }}/src/aria2c.exe
