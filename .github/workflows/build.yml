name: build

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
            target_arch: x86_64
          - runner: ubuntu-22.04
            arch: arm64
            target_arch: aarch64
    steps:
    - uses: actions/checkout@v6
    - name: Detect source directory
      run: |
        if [ -f "configure.ac" ] && [ -d "src" ]; then
          echo "FLUXCORE_DIR=." >> $GITHUB_ENV
        elif [ -f "FluxCore/configure.ac" ] && [ -d "FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore" >> $GITHUB_ENV
        elif [ -f "FluxCore/FluxCore/configure.ac" ] && [ -d "FluxCore/FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore/FluxCore" >> $GITHUB_ENV
        else
          exit 1
        fi
    - name: Linux setup
      run: |
        sudo apt-get update --allow-releaseinfo-change
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -sc) main universe" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -sc)-updates main universe" | sudo tee -a /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y \
            g++-12-aarch64-linux-gnu \
            gcc-12-aarch64-linux-gnu \
            autoconf \
            automake \
            autotools-dev \
            autopoint \
            gettext \
            gettext-base \
            xz-utils \
            libtool \
            pkg-config \
            patchelf \
            cmake \
            wget \
            libssl-dev:arm64 \
            zlib1g-dev:arm64 \
            libsqlite3-dev:arm64 \
            libssh2-1-dev:arm64 \
            libexpat1-dev:arm64
        else
          sudo apt-get install \
            g++-12 \
            autoconf \
            automake \
            autotools-dev \
            autopoint \
            gettext \
            gettext-base \
            xz-utils \
            libtool \
            pkg-config \
            libssl-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssh2-1-dev \
            libexpat1-dev \
            patchelf \
            cmake \
            wget
        fi
    - name: Install c-ares 1.34.6
      run: |
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          echo "Building c-ares 1.34.6 for ARM64"
          wget https://github.com/c-ares/c-ares/releases/download/v1.34.6/c-ares-1.34.6.tar.gz
          tar xzf c-ares-1.34.6.tar.gz
          cd c-ares-1.34.6
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib/aarch64-linux-gnu \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc-12 \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++-12 \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCARES_STATIC=ON \
            -DCARES_SHARED=ON \
            -DCARES_BUILD_TESTS=OFF
          make -j$(nproc)
          sudo make install
          # Create pkgconfig file in the right location
          sudo mkdir -p /usr/lib/aarch64-linux-gnu/pkgconfig
          if [ -f /usr/lib/aarch64-linux-gnu/pkgconfig/libcares.pc ]; then
            echo "libcares.pc already exists"
          else
            sudo cp /usr/lib/pkgconfig/libcares.pc /usr/lib/aarch64-linux-gnu/pkgconfig/ 2>/dev/null || true
          fi
          cd ../..
          rm -rf c-ares-1.34.6 c-ares-1.34.6.tar.gz
        else
          # Check if system c-ares is sufficient
          if pkg-config --exists libcares && pkg-config --atleast-version=1.34.0 libcares; then
            echo "System c-ares version is sufficient"
            pkg-config --modversion libcares
          else
            echo "Building c-ares 1.34.6 for x86_64"
            wget https://github.com/c-ares/c-ares/releases/download/v1.34.6/c-ares-1.34.6.tar.gz
            tar xzf c-ares-1.34.6.tar.gz
            cd c-ares-1.34.6
            mkdir build && cd build
            cmake .. \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DCARES_STATIC=ON \
              -DCARES_SHARED=ON \
              -DCARES_BUILD_TESTS=OFF
            make -j$(nproc)
            sudo make install
            sudo ldconfig
            cd ../..
            rm -rf c-ares-1.34.6 c-ares-1.34.6.tar.gz
          fi
        fi
        # Verify installation
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
          aarch64-linux-gnu-pkg-config --modversion libcares || echo "Warning: libcares not found via pkg-config"
          ls -la /usr/lib/aarch64-linux-gnu/libcares* || echo "Warning: libcares libs not found"
          ls -la /usr/lib/aarch64-linux-gnu/pkgconfig/libcares.pc || echo "Warning: libcares.pc not found"
        else
          pkg-config --modversion libcares
          pkg-config --cflags libcares
          pkg-config --libs libcares
        fi
    - name: Autoreconf
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        rm -rf autom4te.cache
        rm -f configure
        export ACLOCAL_PATH="$(pwd)/m4"
        aclocal -I m4
        if [ ! -f /usr/share/gettext/archive.dir.tar.xz ] && [ -f /usr/share/gettext/archive.dir.tar.gz ]; then
          tmpdir="$(mktemp -d)"
          sudo tar -xzf /usr/share/gettext/archive.dir.tar.gz -C "$tmpdir"
          sudo tar -cJf /usr/share/gettext/archive.dir.tar.xz -C "$tmpdir" .
          sudo rm -rf "$tmpdir"
        fi
        if [ ! -f /usr/share/gettext/archive.dir.tar.xz ]; then
          sudo apt-get update
          sudo apt-get install -y gettext
        fi
        autopoint --force
        AUTOPOINT=true autoreconf -fi -I m4
    - name: Verify configure
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        if grep -n "ARIA2_ARG_WITH" configure; then
          exit 1
        fi
    - name: Configure
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          export CC=aarch64-linux-gnu-gcc-12
          export CXX=aarch64-linux-gnu-g++-12
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
          export PKG_CONFIG=aarch64-linux-gnu-pkg-config
          HOST_FLAG="--host=aarch64-linux-gnu"
          echo "=== ARM64 Cross-compile Configuration ==="
          echo "CC=$CC"
          echo "CXX=$CXX"
          echo "PKG_CONFIG=$PKG_CONFIG"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          $PKG_CONFIG --list-all | grep libcares || echo "libcares not found in pkg-config"
        else
          export CC=gcc-12
          export CXX=g++-12
          HOST_FLAG=""
        fi
        export CFLAGS="-Os -ffunction-sections -fdata-sections"
        export CXXFLAGS="-Os -ffunction-sections -fdata-sections"
        export LDFLAGS="-Wl,--gc-sections"
        ./configure $HOST_FLAG \
          --with-openssl \
          --without-gnutls \
          --with-libcares \
          --with-libssh2 \
          --with-sqlite3 \
          --with-libexpat \
          --without-libxml2 \
          --disable-nls
    - name: Build
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        make -j"$(nproc)"
        strip --strip-unneeded src/xfercore || true
    - name: Verify binary
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        file src/xfercore
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          echo "Cross-compiled for arm64, skipping execution test"
          file src/xfercore | grep -q "aarch64" || file src/xfercore | grep -q "ARM aarch64" || { echo "ERROR: not aarch64"; exit 1; }
        else
          ./src/xfercore -v
        fi
    - name: Collect Linux runtime libs
      shell: bash
      run: |
        set -euo pipefail
        OUT_DIR="dist/FluxCore-linux-${{ matrix.arch }}"
        BIN_PATH="${{ env.FLUXCORE_DIR }}/src/xfercore"
        mkdir -p "$OUT_DIR/lib"
        cp -v "$BIN_PATH" "$OUT_DIR/xfercore"
        chmod +x "$OUT_DIR/xfercore" || true

        echo "=== Binary file type ==="
        file "$BIN_PATH"
        
        echo "=== Checking if binary is dynamically linked ==="
        if file "$BIN_PATH" | grep -q "dynamically linked"; then
          echo "Binary is dynamically linked, collecting libraries..."

          if [ "${{ matrix.arch }}" = "arm64" ]; then
            # Cross-compiled aarch64 binary: ldd cannot run on x86_64 host,
            # use cross-toolchain readelf to enumerate NEEDED libs and
            # resolve them from the multiarch sysroot.
            SYSROOT_DIRS="/usr/lib/aarch64-linux-gnu /usr/aarch64-linux-gnu/lib"
            aarch64-linux-gnu-readelf -d "$BIN_PATH" \
              | awk '/\(NEEDED\)/ {gsub(/\[|\]/, "", $5); print $5}' \
              | while read -r soname; do
                  case "$soname" in
                    libssh2.so.*|libgcrypt.so.*|libgpg-error.so.*|libgmp.so.*|libcares.so.*|libxml2.so.*|libsqlite3.so.*|libz.so.*|libexpat.so.*|libssl.so.*|libcrypto.so.*|libstdc++.so.*|libc.so.*|libm.so.*)
                      for dir in $SYSROOT_DIRS; do
                        if [ -f "$dir/$soname" ]; then
                          echo "Bundling: $soname from $dir"
                          cp -Lv "$dir/$soname" "$OUT_DIR/lib/$soname" || true
                          break
                        fi
                      done
                      ;;
                  esac
                done
          else
            # Native build: use ldd to map soname -> realpath
            ldd "$BIN_PATH" 2>/dev/null | awk '/=> \// {print $1, $3}' | while read -r soname realpath; do
              case "$soname" in
                libssh2.so.*|libgcrypt.so.*|libgpg-error.so.*|libgmp.so.*|libcares.so.*|libxml2.so.*|libsqlite3.so.*|libz.so.*|libexpat.so.*)
                  echo "Bundling: $soname from $realpath"
                  cp -Lv "$realpath" "$OUT_DIR/lib/$soname" || true
                  ;;
              esac
            done
          fi

          # Make binary self-contained: prefer bundled libs under ./lib
          patchelf --set-rpath '$ORIGIN/lib:$ORIGIN' "$OUT_DIR/xfercore" || true

          # Verify final bundle does not miss libs
          echo ""
          echo "=== Final binary dependencies ==="
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            # ldd cannot process cross-arch binary; list NEEDED entries instead
            aarch64-linux-gnu-readelf -d "$OUT_DIR/xfercore" || true
          else
            ldd "$OUT_DIR/xfercore" || true
          fi
        else
          echo "Binary is statically linked, no libraries to collect"
          echo "Note: If this is unexpected, check configure flags"
        fi
        
        echo ""
        echo "=== Final directory structure ==="
        ls -la "$OUT_DIR"
        ls -la "$OUT_DIR/lib" 2>/dev/null || echo "No lib directory (static binary)"
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: FluxCore-linux-${{ matrix.arch }}
        path: dist/FluxCore-linux-${{ matrix.arch }}

  build-macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: x64
            target_arch: x86_64
          - runner: macos-latest
            arch: arm64
            target_arch: arm64
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Detect source directory
      run: |
        if [ -f "configure.ac" ] && [ -d "src" ]; then
          echo "FLUXCORE_DIR=." >> $GITHUB_ENV
        elif [ -f "FluxCore/configure.ac" ] && [ -d "FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore" >> $GITHUB_ENV
        elif [ -f "FluxCore/FluxCore/configure.ac" ] && [ -d "FluxCore/FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore/FluxCore" >> $GITHUB_ENV
        else
          exit 1
        fi
    - name: MacOS setup (build tools)
      run: |
        brew install gettext autoconf automake pkg-config libtool cmake wget
        echo "$(brew --prefix gettext)/bin" >> $GITHUB_PATH
    - name: Build macOS deps from source
      env:
        PREFIX: /tmp/flux-deps-${{ matrix.arch }}
        ARCHFLAG: -arch ${{ matrix.target_arch }}
      run: |
        set -euo pipefail
        NCORES=$(sysctl -n hw.ncpu)
        mkdir -p "$PREFIX"

        # ---- zlib ----
        curl -fsSL https://zlib.net/zlib-1.3.2.tar.gz | tar xz
        cd zlib-1.3.2
        CFLAGS="$ARCHFLAG -Os" ./configure --static --prefix="$PREFIX"
        make -j$NCORES && make install
        cd ..

        # ---- expat ----
        curl -fsSL https://github.com/libexpat/libexpat/releases/download/R_2_7_1/expat-2.7.1.tar.gz | tar xz
        cd expat-2.7.1
        ./configure --enable-static --disable-shared --prefix="$PREFIX" \
          CFLAGS="$ARCHFLAG -Os" LDFLAGS="$ARCHFLAG"
        make -j$NCORES && make install
        cd ..

        # ---- sqlite3 ----
        curl -fsSL https://www.sqlite.org/2026/sqlite-autoconf-3520000.tar.gz | tar xz
        cd sqlite-autoconf-3520000
        ./configure --enable-static --disable-shared --prefix="$PREFIX" \
          CFLAGS="$ARCHFLAG -Os" LDFLAGS="$ARCHFLAG"
        make -j$NCORES && make install
        cd ..

        # ---- c-ares ----
        curl -fsSL https://github.com/c-ares/c-ares/releases/download/v1.34.6/c-ares-1.34.6.tar.gz | tar xz
        cd c-ares-1.34.6
        mkdir build && cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$PREFIX" \
          -DCMAKE_C_FLAGS="$ARCHFLAG -Os" \
          -DCMAKE_OSX_ARCHITECTURES="${{ matrix.target_arch }}" \
          -DCARES_STATIC=ON -DCARES_SHARED=ON -DCARES_BUILD_TESTS=OFF
        make -j$NCORES && make install
        cd ../..

        # ---- openssl ----
        curl -fsSL https://github.com/openssl/openssl/releases/download/openssl-3.4.6/openssl-3.4.6.tar.gz | tar xz
        cd openssl-3.4.6
        if [ "${{ matrix.target_arch }}" = "x86_64" ]; then
          OS_COMPILER=darwin64-x86_64-cc
        else
          OS_COMPILER=darwin64-arm64-cc
        fi
        echo "Building OpenSSL for $OS_COMPILER"
        ./Configure "$OS_COMPILER" \
          --prefix="$PREFIX" --openssldir="$PREFIX/ssl" \
          no-shared no-tests
        make -j$NCORES
        make install_sw
        echo "OpenSSL built. Checking libs:"
        ls -la "$PREFIX/lib"/libcrypto* "$PREFIX/lib"/libssl* "$PREFIX/lib/pkgconfig/"*.pc 2>/dev/null || echo "WARNING: crypto libs not found"
        cd ..

        # ---- libssh2 ----
        curl -fsSL https://libssh2.org/download/libssh2-1.11.1.tar.gz | tar xz
        cd libssh2-1.11.1
        export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
        export CFLAGS="-arch ${{ matrix.target_arch }} -Os -isysroot $(xcrun --sdk macosx --show-sdk-path) -I$PREFIX/include"
        export LDFLAGS="-arch ${{ matrix.target_arch }} -isysroot $(xcrun --sdk macosx --show-sdk-path) -L$PREFIX/lib"
        export CPPFLAGS="-I$PREFIX/include"
        export LIBS="-L$PREFIX/lib -lssl -lcrypto"
        ./configure --enable-static --disable-shared --prefix="$PREFIX" \
          --with-crypto=openssl \
          --with-libssl-prefix="$PREFIX"
        make -j$NCORES && make install
        cd ..

        ls -la "$PREFIX/lib"
    - name: Autoreconf
      working-directory: ${{ env.FLUXCORE_DIR }}
      env:
        PREFIX: /tmp/flux-deps-${{ matrix.arch }}
      run: |
        rm -rf autom4te.cache
        rm -f configure
        export ACLOCAL_PATH="$(pwd)/m4:$PREFIX/share/aclocal"
        aclocal -I m4
        autopoint --force
        autoreconf -fi -I m4
    - name: Verify configure
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        if grep -n "ARIA2_ARG_WITH" configure; then
          exit 1
        fi
    - name: Configure
      working-directory: ${{ env.FLUXCORE_DIR }}
      env:
        PREFIX: /tmp/flux-deps-${{ matrix.arch }}
      run: |
        export CFLAGS="-arch ${{ matrix.target_arch }} -mmacosx-version-min=15.0 -Os -ffunction-sections -fdata-sections -I$PREFIX/include"
        export CXXFLAGS="-arch ${{ matrix.target_arch }} -mmacosx-version-min=15.0 -Os -ffunction-sections -fdata-sections -I$PREFIX/include"
        export LDFLAGS="-arch ${{ matrix.target_arch }} -mmacosx-version-min=15.0 -Wl,-dead_strip -L$PREFIX/lib"
        export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
        ./configure \
          --without-openssl --without-gnutls --with-appletls \
          --with-libcares \
          --with-libssh2 \
          --with-sqlite3 \
          --with-libexpat \
          --with-libz \
          --without-libxml2 \
          --disable-nls \
          ARIA2_STATIC=no
    - name: Build
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        make -j"$(sysctl -n hw.ncpu)"
        strip -x src/xfercore || true
    - name: Verify binary (before lib collection)
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        file src/xfercore
        otool -L src/xfercore
        if [ "${{ matrix.arch }}" = "x64" ]; then
          file src/xfercore | grep -q "x86_64" || { echo "ERROR: not x86_64"; exit 1; }
          echo "x64 binary verified (architecture check only, execution test after lib collection)"
        else
          file src/xfercore | grep -q "arm64" || { echo "ERROR: not arm64"; exit 1; }
          echo "arm64 binary verified (architecture check only, execution test after lib collection)"
        fi
    - name: Collect macOS runtime libs
      shell: bash
      env:
        PREFIX: /tmp/flux-deps-${{ matrix.arch }}
      run: |
        set -euo pipefail
        OUT_DIR="dist/FluxCore-macos-${{ matrix.arch }}"
        BIN_PATH="${{ env.FLUXCORE_DIR }}/src/xfercore"
        mkdir -p "$OUT_DIR/lib"
        cp -v "$BIN_PATH" "$OUT_DIR/xfercore"
        chmod +x "$OUT_DIR/xfercore" || true

        echo "=== Initial binary dependencies ==="
        otool -L "$BIN_PATH"

        # Bundle libs from our prefix AND from /opt/homebrew (for native arm64 build)
        should_bundle () {
          local p="$1"
          [[ "$p" == /opt/homebrew/* ]] || [[ "$p" == /usr/local/* ]] || [[ "$p" == "$PREFIX"/* ]]
        }

        queue=("$OUT_DIR/xfercore")
        # Portable dedup (macOS bash 3.2 has no associative arrays):
        # track processed paths in an indexed array with linear search.
        processed_paths=()
        is_processed () {
          local target="$1"
          for p in "${processed_paths[@]:-}"; do
            [ "$p" = "$target" ] && return 0
          done
          return 1
        }
        idx=0

        echo "=== Starting dependency collection ==="
        while [ $idx -lt ${#queue[@]} ]; do
          f="${queue[$idx]}"
          idx=$((idx + 1))
          echo "Processing: $f"

          while IFS= read -r dep; do
            [ -z "$dep" ] && continue

            # Skip system frameworks and libs
            if [[ "$dep" == /System/* ]] || [[ "$dep" == /usr/lib/* ]] || [[ "$dep" == @rpath/* ]] || [[ "$dep" == @executable_path/* ]] || [[ "$dep" == @loader_path/* ]]; then
              continue
            fi

            if should_bundle "$dep" && [ -f "$dep" ]; then
              base="$(basename "$dep")"
              dest="$OUT_DIR/lib/$base"

              if ! is_processed "$dep"; then
                echo "  Bundling: $dep -> $dest"
                cp -Lv "$dep" "$dest"
                chmod 755 "$dest" || true
                processed_paths+=("$dep")
                queue+=("$dest")
              fi
            fi
          done < <(otool -L "$f" 2>/dev/null | tail -n +2 | awk '{print $1}')
        done

        # Also check for @rpath references and copy those libs
        echo "=== Checking for @rpath dependencies ==="
        for f in "$OUT_DIR/xfercore"; do
          while IFS= read -r dep; do
            if [[ "$dep" == @rpath/* ]]; then
              libname="${dep#@rpath/}"
              echo "Found @rpath dependency: $libname"
              
              # Search in PREFIX/lib
              if [ -f "$PREFIX/lib/$libname" ]; then
                dest="$OUT_DIR/lib/$libname"
                if [ ! -f "$dest" ]; then
                  echo "  Copying from PREFIX: $PREFIX/lib/$libname -> $dest"
                  cp -Lv "$PREFIX/lib/$libname" "$dest"
                  chmod 755 "$dest" || true
                  queue+=("$dest")
                fi
              fi
            fi
          done < <(otool -L "$f" 2>/dev/null | tail -n +2 | awk '{print $1}')
        done

        # Rewrite dylib references to relative paths and add @executable_path/lib to rpath
        echo "=== Rewriting library references ==="
        for f in "$OUT_DIR/xfercore" "$OUT_DIR"/lib/*; do
          [ -f "$f" ] || continue
          
          echo "Processing: $f"
          
          # Add @executable_path/lib or @loader_path to rpath if not already present
          if [[ "$f" == "$OUT_DIR/xfercore" ]]; then
            if ! otool -l "$f" | grep -q "@executable_path/lib"; then
              echo "  Adding @executable_path/lib to rpath"
              install_name_tool -add_rpath "@executable_path/lib" "$f" || true
            fi
          fi
          
          while IFS= read -r dep; do
            [ -z "$dep" ] && continue
            
            # Handle @rpath references
            if [[ "$dep" == @rpath/* ]]; then
              libname="${dep#@rpath/}"
              if [ -f "$OUT_DIR/lib/$libname" ]; then
                if [[ "$f" == "$OUT_DIR/xfercore" ]]; then
                  newpath="@executable_path/lib/$libname"
                  echo "  Changing @rpath/$libname -> $newpath"
                  install_name_tool -change "$dep" "$newpath" "$f" || true
                else
                  newpath="@loader_path/$libname"
                  echo "  Changing @rpath/$libname -> $newpath"
                  install_name_tool -change "$dep" "$newpath" "$f" || true
                fi
              fi
              continue
            fi
            
            # Handle absolute paths
            base="$(basename "$dep")"
            if [ -f "$OUT_DIR/lib/$base" ]; then
              if [[ "$f" == "$OUT_DIR/xfercore" ]]; then
                localRefExe="@executable_path/lib/$base"
                echo "  Changing $dep -> $localRefExe"
                install_name_tool -change "$dep" "$localRefExe" "$f" || true
              else
                localRefDylib="@loader_path/$base"
                echo "  Changing $dep -> $localRefDylib"
                install_name_tool -change "$dep" "$localRefDylib" "$f" || true
              fi
            fi
          done < <(otool -L "$f" 2>/dev/null | tail -n +2 | awk '{print $1}')
          
          if [[ "$f" == "$OUT_DIR"/lib/* ]]; then
            echo "  Setting id to @loader_path/$(basename "$f")"
            install_name_tool -id "@loader_path/$(basename "$f")" "$f" || true
          fi
        done

        echo "=== Final binary info ==="
        ls -la "$OUT_DIR"
        echo ""
        echo "=== Bundled libraries ==="
        ls -la "$OUT_DIR/lib" || true
        echo ""
        echo "=== Binary dependencies ==="
        otool -L "$OUT_DIR/xfercore"
        echo ""
        echo "=== Binary rpaths ==="
        otool -l "$OUT_DIR/xfercore" | grep -A 2 LC_RPATH || echo "No RPATH found"
    - name: Test bundled binary
      shell: bash
      run: |
        OUT_DIR="dist/FluxCore-macos-${{ matrix.arch }}"
        cd "$OUT_DIR"
        if [ "${{ matrix.arch }}" = "x64" ]; then
          echo "x64 binary on arm64 host, architecture validation only"
          file xfercore | grep -q "x86_64" || { echo "ERROR: not x86_64"; exit 1; }
        else
          echo "Testing arm64 binary..."
          ./xfercore -v
        fi
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: FluxCore-macos-${{ matrix.arch }}
        path: dist/FluxCore-macos-${{ matrix.arch }}/

  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msystem: MINGW64
            mingw_dir: mingw64
            host: x86_64-w64-mingw32
            packages: >-
              mingw-w64-x86_64-toolchain
              autoconf
              automake
              libtool
              pkg-config
              make
              gettext
              gettext-devel
              xz
              mingw-w64-x86_64-openssl
              mingw-w64-x86_64-libssh2
              mingw-w64-x86_64-sqlite3
              mingw-w64-x86_64-expat
              mingw-w64-x86_64-gmp
              mingw-w64-x86_64-zlib
              mingw-w64-x86_64-cmake
              wget
    steps:
    - uses: actions/checkout@v6
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: true
        install: ${{ matrix.packages }}
    - name: Detect source directory
      shell: msys2 {0}
      run: |
        if [ -f "configure.ac" ] && [ -d "src" ]; then
          echo "FLUXCORE_DIR=." >> $GITHUB_ENV
        elif [ -f "FluxCore/configure.ac" ] && [ -d "FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore" >> $GITHUB_ENV
        elif [ -f "FluxCore/FluxCore/configure.ac" ] && [ -d "FluxCore/FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore/FluxCore" >> $GITHUB_ENV
        else
          exit 1
        fi
    - name: Install c-ares 1.34.6
      shell: msys2 {0}
      run: |
        # Check if MSYS2 c-ares is sufficient
        if pkg-config --exists libcares && pkg-config --atleast-version=1.34.0 libcares; then
          echo "MSYS2 c-ares version is sufficient"
          pkg-config --modversion libcares
        else
          echo "Building c-ares 1.34.6 from source"
          wget https://github.com/c-ares/c-ares/releases/download/v1.34.6/c-ares-1.34.6.tar.gz
          tar xzf c-ares-1.34.6.tar.gz
          cd c-ares-1.34.6
          mkdir build && cd build
          cmake .. \
            -G "MSYS Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/${{ matrix.mingw_dir }} \
            -DCARES_STATIC=ON \
            -DCARES_SHARED=ON \
            -DCARES_BUILD_TESTS=OFF
          make -j$(nproc)
          make install
          cd ../..
          rm -rf c-ares-1.34.6 c-ares-1.34.6.tar.gz
        fi
        # Verify installation
        pkg-config --modversion libcares
        pkg-config --cflags libcares
        pkg-config --libs libcares
    - name: Autoreconf
      shell: msys2 {0}
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        rm -rf autom4te.cache
        rm -f configure
        export ACLOCAL_PATH="$(pwd)/m4"
        aclocal -I m4
        if [ ! -f ./config.rpath ] && [ -f /usr/share/gettext/config.rpath ]; then
          cp /usr/share/gettext/config.rpath ./config.rpath
        fi
        if [ ! -f ./config.rpath ]; then
          ap="$(command -v autopoint || true)"
          if [ -n "$ap" ]; then
            p="$(cd "$(dirname "$ap")/.." && pwd)/share/gettext/config.rpath"
            if [ -f "$p" ]; then
              cp "$p" ./config.rpath
            fi
          fi
        fi
        autoreconf -fi -I m4
    - name: Verify configure
      shell: msys2 {0}
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        if grep -n "ARIA2_ARG_WITH" configure; then
          exit 1
        fi
    - name: Configure
      shell: msys2 {0}
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        ./configure \
          --host=${{ matrix.host }} \
          --without-included-gettext \
          --disable-nls \
          --with-libcares \
          --without-gnutls \
          --without-wintls \
          --with-openssl \
          --with-sqlite3 \
          --without-libxml2 \
          --with-libexpat \
          --with-libz \
          --with-libgmp \
          --with-libssh2 \
          --without-libgcrypt \
          --without-libnettle \
          --disable-dependency-tracking \
          ARIA2_STATIC=yes \
          CFLAGS="-Os -ffunction-sections -fdata-sections" \
          CXXFLAGS="-Os -ffunction-sections -fdata-sections" \
          CPPFLAGS="-I/${{ matrix.mingw_dir }}/include" \
          LDFLAGS="-Wl,--gc-sections -L/${{ matrix.mingw_dir }}/lib" \
          LIBS="-lcrypt32" \
          PKG_CONFIG_PATH="/${{ matrix.mingw_dir }}/lib/pkgconfig"
    - name: Build
      shell: msys2 {0}
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        make -j"$(nproc)"
        strip -s src/xfercore.exe || true
    - name: Verify binary
      shell: msys2 {0}
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        ./src/xfercore.exe -v
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: FluxCore-windows-${{ matrix.arch }}
        path: ${{ env.FLUXCORE_DIR }}/src/xfercore.exe
