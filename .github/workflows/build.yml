name: build

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04
            arch: arm64
    steps:
    - uses: actions/checkout@v6
    - name: Detect source directory
      run: |
        if [ -f "configure.ac" ] && [ -d "src" ]; then
          echo "FLUXCORE_DIR=." >> $GITHUB_ENV
        elif [ -f "FluxCore/configure.ac" ] && [ -d "FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore" >> $GITHUB_ENV
        elif [ -f "FluxCore/FluxCore/configure.ac" ] && [ -d "FluxCore/FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore/FluxCore" >> $GITHUB_ENV
        else
          exit 1
        fi
    - name: Linux setup
      run: |
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          sudo dpkg --add-architecture arm64
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo mv /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources.disabled
          fi
          printf '%s\n' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse' \
            'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse' \
            | sudo tee /etc/apt/sources.list > /dev/null
        fi
        sudo apt-get update
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          sudo apt-get install \
            g++-12 \
            autoconf \
            automake \
            autotools-dev \
            autopoint \
            gettext \
            gettext-base \
            libtool \
            pkg-config \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libssl-dev:arm64 \
            libc-ares-dev:arm64 \
            zlib1g-dev:arm64 \
            libsqlite3-dev:arm64 \
            libssh2-1-dev:arm64 \
            libexpat1-dev:arm64
        else
          sudo apt-get install \
            g++-12 \
            autoconf \
            automake \
            autotools-dev \
            autopoint \
            gettext \
            gettext-base \
            libtool \
            pkg-config \
            libssl-dev \
            libc-ares-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssh2-1-dev \
            libexpat1-dev
        fi
    - name: Autoreconf
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        rm -rf autom4te.cache
        rm -f configure
        export ACLOCAL_PATH="$(pwd)/m4"
        aclocal -I m4
        if [ ! -f /usr/share/gettext/archive.dir.tar.xz ] && [ -f /usr/share/gettext/archive.dir.tar.gz ]; then
          sudo ln -sf /usr/share/gettext/archive.dir.tar.gz /usr/share/gettext/archive.dir.tar.xz
        fi
        if [ ! -f /usr/share/gettext/archive.dir.tar.xz ]; then
          sudo apt-get update
          sudo apt-get install -y gettext
        fi
        autopoint --force
        AUTOPOINT=true autoreconf -fi -I m4
    - name: Verify configure
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        if grep -n "ARIA2_ARG_WITH" configure; then
          exit 1
        fi
    - name: Configure
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++
          export PKG_CONFIG_LIBDIR="/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
          export CPPFLAGS="-I/usr/include/aarch64-linux-gnu"
          export LDFLAGS="-L/usr/lib/aarch64-linux-gnu"
          HOST_FLAG="--host=aarch64-linux-gnu"
        else
          HOST_FLAG=""
        fi
        ./configure $HOST_FLAG \
          --with-openssl \
          --without-gnutls \
          --with-libcares \
          --with-libssh2 \
          --with-sqlite3 \
          --with-libexpat \
          --without-libxml2 \
          --disable-nls
    - name: Build
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        make -j"$(nproc)"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FluxCore-linux-${{ matrix.arch }}
        path: ${{ env.FLUXCORE_DIR }}/src/aria2c

  build-macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-12
            arch: x64
          - runner: macos-14
            arch: arm64
    steps:
    - uses: actions/checkout@v6
    - name: Detect source directory
      run: |
        if [ -f "configure.ac" ] && [ -d "src" ]; then
          echo "FLUXCORE_DIR=." >> $GITHUB_ENV
        elif [ -f "FluxCore/configure.ac" ] && [ -d "FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore" >> $GITHUB_ENV
        elif [ -f "FluxCore/FluxCore/configure.ac" ] && [ -d "FluxCore/FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore/FluxCore" >> $GITHUB_ENV
        else
          exit 1
        fi
    - name: MacOS setup
      run: |
        brew install gettext openssl libssh2 c-ares sqlite3 \
          autoconf automake pkg-config libtool expat
    - name: MacOS gettext path
      run: |
        echo "$(brew --prefix gettext)/bin" >> $GITHUB_PATH
    - name: Autoreconf
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        rm -rf autom4te.cache
        rm -f configure
        export ACLOCAL_PATH="$(pwd)/m4"
        aclocal -I m4
        autopoint --force
        autoreconf -fi -I m4
    - name: Verify configure
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        if grep -n "ARIA2_ARG_WITH" configure; then
          exit 1
        fi
    - name: Configure
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        ./configure \
          --without-openssl --without-gnutls --with-appletls \
          --with-libcares \
          --with-libssh2 \
          --with-sqlite3 \
          --with-libexpat \
          --without-libxml2 \
          --disable-nls
    - name: Build
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        make -j"$(sysctl -n hw.ncpu)"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FluxCore-macos-${{ matrix.arch }}
        path: ${{ env.FLUXCORE_DIR }}/src/aria2c

  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msystem: MINGW64
            mingw_dir: mingw64
            host: x86_64-w64-mingw32
            packages: >-
              mingw-w64-x86_64-toolchain
              autoconf
              automake
              libtool
              pkg-config
              gettext
              mingw-w64-x86_64-openssl
              mingw-w64-x86_64-libssh2
              mingw-w64-x86_64-c-ares
              mingw-w64-x86_64-sqlite3
              mingw-w64-x86_64-expat
              mingw-w64-x86_64-gmp
              mingw-w64-x86_64-zlib
          - arch: ia32
            msystem: MINGW32
            mingw_dir: mingw32
            host: i686-w64-mingw32
            packages: >-
              mingw-w64-i686-toolchain
              autoconf
              automake
              libtool
              pkg-config
              gettext
              mingw-w64-i686-openssl
              mingw-w64-i686-libssh2
              mingw-w64-i686-c-ares
              mingw-w64-i686-sqlite3
              mingw-w64-i686-expat
              mingw-w64-i686-gmp
              mingw-w64-i686-zlib
    steps:
    - uses: actions/checkout@v6
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: true
        install: ${{ matrix.packages }}
    - name: Detect source directory
      shell: msys2 {0}
      run: |
        if [ -f "configure.ac" ] && [ -d "src" ]; then
          echo "FLUXCORE_DIR=." >> $GITHUB_ENV
        elif [ -f "FluxCore/configure.ac" ] && [ -d "FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore" >> $GITHUB_ENV
        elif [ -f "FluxCore/FluxCore/configure.ac" ] && [ -d "FluxCore/FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore/FluxCore" >> $GITHUB_ENV
        else
          exit 1
        fi
    - name: Autoreconf
      shell: msys2 {0}
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        rm -rf autom4te.cache
        rm -f configure
        export ACLOCAL_PATH="$(pwd)/m4"
        aclocal -I m4
        autopoint --force
        autoreconf -fi -I m4
    - name: Verify configure
      shell: msys2 {0}
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        if grep -n "ARIA2_ARG_WITH" configure; then
          exit 1
        fi
    - name: Configure
      shell: msys2 {0}
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        ./configure \
          --host=${{ matrix.host }} \
          --without-included-gettext \
          --disable-nls \
          --with-libcares \
          --without-gnutls \
          --without-wintls \
          --with-openssl \
          --with-sqlite3 \
          --without-libxml2 \
          --with-libexpat \
          --with-libz \
          --with-libgmp \
          --with-libssh2 \
          --without-libgcrypt \
          --without-libnettle \
          ARIA2_STATIC=yes \
          CPPFLAGS="-I/${{ matrix.mingw_dir }}/include" \
          LDFLAGS="-L/${{ matrix.mingw_dir }}/lib" \
          LIBS="-lcrypt32" \
          PKG_CONFIG_PATH="/${{ matrix.mingw_dir }}/lib/pkgconfig"
    - name: Build
      shell: msys2 {0}
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        make -j"$(nproc)"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FluxCore-windows-${{ matrix.arch }}
        path: ${{ env.FLUXCORE_DIR }}/src/aria2c.exe
