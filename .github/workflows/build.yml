name: build

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6
    - name: Detect source directory
      run: |
        if [ -f "configure.ac" ] && [ -d "src" ]; then
          echo "FLUXCORE_DIR=." >> $GITHUB_ENV
        elif [ -f "FluxCore/configure.ac" ] && [ -d "FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore" >> $GITHUB_ENV
        elif [ -f "FluxCore/FluxCore/configure.ac" ] && [ -d "FluxCore/FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore/FluxCore" >> $GITHUB_ENV
        else
          exit 1
        fi
    - name: Linux setup
      run: |
        sudo apt-get update
        sudo apt-get install \
          g++-12 \
          autoconf \
          automake \
          autotools-dev \
          autopoint \
          gettext \
          libtool \
          pkg-config \
          libssl-dev \
          libc-ares-dev \
          zlib1g-dev \
          libsqlite3-dev \
          libssh2-1-dev \
          libexpat1-dev
    - name: Autoreconf
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        rm -f configure
        autoreconf -fi -I m4
    - name: Verify configure
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        if grep -n "ARIA2_ARG_WITH" configure; then
          exit 1
        fi
    - name: Configure
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        ./configure \
          --with-openssl \
          --without-gnutls \
          --with-libcares \
          --with-libssh2 \
          --with-sqlite3 \
          --with-libexpat \
          --without-libxml2 \
          --disable-nls
    - name: Build
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        make -j"$(nproc)"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FluxCore-linux
        path: ${{ env.FLUXCORE_DIR }}/src/aria2c

  build-macos:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v6
    - name: Detect source directory
      run: |
        if [ -f "configure.ac" ] && [ -d "src" ]; then
          echo "FLUXCORE_DIR=." >> $GITHUB_ENV
        elif [ -f "FluxCore/configure.ac" ] && [ -d "FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore" >> $GITHUB_ENV
        elif [ -f "FluxCore/FluxCore/configure.ac" ] && [ -d "FluxCore/FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore/FluxCore" >> $GITHUB_ENV
        else
          exit 1
        fi
    - name: MacOS setup
      run: |
        brew install gettext openssl libssh2 c-ares sqlite3 \
          autoconf automake pkg-config libtool expat
    - name: MacOS gettext path
      run: |
        echo "$(brew --prefix gettext)/bin" >> $GITHUB_PATH
    - name: Autoreconf
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        rm -f configure
        autoreconf -fi -I m4
    - name: Verify configure
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        if grep -n "ARIA2_ARG_WITH" configure; then
          exit 1
        fi
    - name: Configure
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        ./configure \
          --without-openssl --without-gnutls --with-appletls \
          --with-libcares \
          --with-libssh2 \
          --with-sqlite3 \
          --with-libexpat \
          --without-libxml2 \
          --disable-nls
    - name: Build
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        make -j"$(sysctl -n hw.ncpu)"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FluxCore-macos
        path: ${{ env.FLUXCORE_DIR }}/src/aria2c

  build-windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v6
    - uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          mingw-w64-x86_64-toolchain
          autoconf
          automake
          libtool
          pkg-config
          gettext
          mingw-w64-x86_64-openssl
          mingw-w64-x86_64-libssh2
          mingw-w64-x86_64-c-ares
          mingw-w64-x86_64-sqlite3
          mingw-w64-x86_64-expat
          mingw-w64-x86_64-gmp
          mingw-w64-x86_64-zlib
    - name: Detect source directory
      shell: msys2 {0}
      run: |
        if [ -f "configure.ac" ] && [ -d "src" ]; then
          echo "FLUXCORE_DIR=." >> $GITHUB_ENV
        elif [ -f "FluxCore/configure.ac" ] && [ -d "FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore" >> $GITHUB_ENV
        elif [ -f "FluxCore/FluxCore/configure.ac" ] && [ -d "FluxCore/FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore/FluxCore" >> $GITHUB_ENV
        else
          exit 1
        fi
    - name: Autoreconf
      shell: msys2 {0}
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        rm -f configure
        autoreconf -fi -I m4
    - name: Verify configure
      shell: msys2 {0}
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        if grep -n "ARIA2_ARG_WITH" configure; then
          exit 1
        fi
    - name: Configure
      shell: msys2 {0}
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        ./configure \
          --host=x86_64-w64-mingw32 \
          --without-included-gettext \
          --disable-nls \
          --with-libcares \
          --without-gnutls \
          --without-wintls \
          --with-openssl \
          --with-sqlite3 \
          --without-libxml2 \
          --with-libexpat \
          --with-libz \
          --with-libgmp \
          --with-libssh2 \
          --without-libgcrypt \
          --without-libnettle \
          ARIA2_STATIC=yes \
          CPPFLAGS="-I/mingw64/include" \
          LDFLAGS="-L/mingw64/lib" \
          LIBS="-lcrypt32" \
          PKG_CONFIG_PATH="/mingw64/lib/pkgconfig"
    - name: Build
      shell: msys2 {0}
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        make -j"$(nproc)"
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FluxCore-windows
        path: ${{ env.FLUXCORE_DIR }}/src/aria2c.exe
