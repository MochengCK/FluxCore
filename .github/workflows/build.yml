name: build

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04
            arch: arm64
    steps:
    - uses: actions/checkout@v6
    - name: Detect source directory
      run: |
        if [ -f "configure.ac" ] && [ -d "src" ]; then
          echo "FLUXCORE_DIR=." >> $GITHUB_ENV
        elif [ -f "FluxCore/configure.ac" ] && [ -d "FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore" >> $GITHUB_ENV
        elif [ -f "FluxCore/FluxCore/configure.ac" ] && [ -d "FluxCore/FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore/FluxCore" >> $GITHUB_ENV
        else
          exit 1
        fi
    - name: Linux setup
      run: |
        sudo apt-get update --allow-releaseinfo-change
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          sudo apt-get install \
            g++-12 \
            autoconf \
            automake \
            autotools-dev \
            autopoint \
            gettext \
            gettext-base \
            xz-utils \
            libtool \
            pkgconf \
            libssl-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssh2-1-dev \
            libexpat1-dev \
            patchelf \
            cmake \
            wget
        else
          sudo apt-get install \
            g++-12 \
            autoconf \
            automake \
            autotools-dev \
            autopoint \
            gettext \
            gettext-base \
            xz-utils \
            libtool \
            pkg-config \
            libssl-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssh2-1-dev \
            libexpat1-dev \
            patchelf \
            cmake \
            wget
        fi
    - name: Install c-ares 1.34.6
      run: |
        # Check if system c-ares is sufficient
        if pkg-config --exists libcares && pkg-config --atleast-version=1.34.0 libcares; then
          echo "System c-ares version is sufficient"
          pkg-config --modversion libcares
        else
          echo "Building c-ares 1.34.6 from source"
          wget https://github.com/c-ares/c-ares/releases/download/v1.34.6/c-ares-1.34.6.tar.gz
          tar xzf c-ares-1.34.6.tar.gz
          cd c-ares-1.34.6
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCARES_STATIC=ON \
            -DCARES_SHARED=ON \
            -DCARES_BUILD_TESTS=OFF
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          cd ../..
          rm -rf c-ares-1.34.6 c-ares-1.34.6.tar.gz
        fi
        # Verify installation
        pkg-config --modversion libcares
        pkg-config --cflags libcares
        pkg-config --libs libcares
    - name: Autoreconf
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        rm -rf autom4te.cache
        rm -f configure
        export ACLOCAL_PATH="$(pwd)/m4"
        aclocal -I m4
        if [ ! -f /usr/share/gettext/archive.dir.tar.xz ] && [ -f /usr/share/gettext/archive.dir.tar.gz ]; then
          tmpdir="$(mktemp -d)"
          sudo tar -xzf /usr/share/gettext/archive.dir.tar.gz -C "$tmpdir"
          sudo tar -cJf /usr/share/gettext/archive.dir.tar.xz -C "$tmpdir" .
          sudo rm -rf "$tmpdir"
        fi
        if [ ! -f /usr/share/gettext/archive.dir.tar.xz ]; then
          sudo apt-get update
          sudo apt-get install -y gettext
        fi
        autopoint --force
        AUTOPOINT=true autoreconf -fi -I m4
    - name: Verify configure
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        if grep -n "ARIA2_ARG_WITH" configure; then
          exit 1
        fi
    - name: Configure
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          export CC=gcc
          export CXX=g++
          HOST_FLAG=""
        else
          HOST_FLAG=""
        fi
        export CFLAGS="-Os -ffunction-sections -fdata-sections"
        export CXXFLAGS="-Os -ffunction-sections -fdata-sections"
        export LDFLAGS="-Wl,--gc-sections"
        ./configure $HOST_FLAG \
          --with-openssl \
          --without-gnutls \
          --with-libcares \
          --with-libssh2 \
          --with-sqlite3 \
          --with-libexpat \
          --without-libxml2 \
          --disable-nls
    - name: Build
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        make -j"$(nproc)"
        strip --strip-unneeded src/fluxcore || true
    - name: Verify binary
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        ./src/fluxcore -v
    - name: Collect Linux runtime libs
      shell: bash
      run: |
        set -euo pipefail
        OUT_DIR="dist/FluxCore-linux-${{ matrix.arch }}"
        BIN_PATH="${{ env.FLUXCORE_DIR }}/src/fluxcore"
        mkdir -p "$OUT_DIR/lib"
        cp -v "$BIN_PATH" "$OUT_DIR/fluxcore"
        chmod +x "$OUT_DIR/fluxcore" || true

        # Bundle key shared libs so downstream app packaging can run on hosts missing them.
        ldd "$BIN_PATH" | awk '/=> \// {print $1, $3}' | while read -r soname realpath; do
          case "$soname" in
            libssh2.so.*|libgcrypt.so.*|libgpg-error.so.*|libgmp.so.*|libcares.so.*|libxml2.so.*|libsqlite3.so.*|libz.so.*|libexpat.so.*)
              cp -Lv "$realpath" "$OUT_DIR/lib/$soname" || true
              ;;
          esac
        done
        # Make binary self-contained: prefer bundled libs under ./lib
        patchelf --set-rpath '$ORIGIN/lib:$ORIGIN' "$OUT_DIR/fluxcore" || true
        # Verify final bundle does not miss libs
        ldd "$OUT_DIR/fluxcore" || true
        if ldd "$OUT_DIR/fluxcore" | grep -q "not found"; then
          echo "ERROR: unresolved shared libraries in bundled fluxcore"
          ldd "$OUT_DIR/fluxcore"
          exit 1
        fi
        ls -la "$OUT_DIR"
        ls -la "$OUT_DIR/lib" || true
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FluxCore-linux-${{ matrix.arch }}
        path: dist/FluxCore-linux-${{ matrix.arch }}

  build-macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: x64
            target_arch: x86_64
          - runner: macos-latest
            arch: arm64
            target_arch: arm64
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Detect source directory
      run: |
        if [ -f "configure.ac" ] && [ -d "src" ]; then
          echo "FLUXCORE_DIR=." >> $GITHUB_ENV
        elif [ -f "FluxCore/configure.ac" ] && [ -d "FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore" >> $GITHUB_ENV
        elif [ -f "FluxCore/FluxCore/configure.ac" ] && [ -d "FluxCore/FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore/FluxCore" >> $GITHUB_ENV
        else
          exit 1
        fi
    - name: MacOS setup (build tools)
      run: |
        brew install gettext autoconf automake pkg-config libtool cmake wget
        echo "$(brew --prefix gettext)/bin" >> $GITHUB_PATH
    - name: Build macOS deps from source
      env:
        PREFIX: /tmp/flux-deps-${{ matrix.arch }}
        ARCHFLAG: -arch ${{ matrix.target_arch }}
      run: |
        set -euo pipefail
        NCORES=$(sysctl -n hw.ncpu)
        mkdir -p "$PREFIX"

        # ---- zlib ----
        curl -fsSL https://zlib.net/zlib-1.3.2.tar.gz | tar xz
        cd zlib-1.3.2
        CFLAGS="$ARCHFLAG -Os" ./configure --static --prefix="$PREFIX"
        make -j$NCORES && make install
        cd ..

        # ---- expat ----
        curl -fsSL https://github.com/libexpat/libexpat/releases/download/R_2_6_4/expat-2.6.4.tar.gz | tar xz
        cd expat-2.6.4
        ./configure --enable-static --disable-shared --prefix="$PREFIX" \
          CFLAGS="$ARCHFLAG -Os" LDFLAGS="$ARCHFLAG"
        make -j$NCORES && make install
        cd ..

        # ---- sqlite3 ----
        curl -fsSL https://www.sqlite.org/2025/sqlite-autoconf-3490100.tar.gz | tar xz
        cd sqlite-autoconf-3490100
        ./configure --enable-static --disable-shared --prefix="$PREFIX" \
          CFLAGS="$ARCHFLAG -Os" LDFLAGS="$ARCHFLAG"
        make -j$NCORES && make install
        cd ..

        # ---- c-ares ----
        curl -fsSL https://github.com/c-ares/c-ares/releases/download/v1.34.6/c-ares-1.34.6.tar.gz | tar xz
        cd c-ares-1.34.6
        mkdir build && cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$PREFIX" \
          -DCMAKE_C_FLAGS="$ARCHFLAG -Os" \
          -DCMAKE_OSX_ARCHITECTURES="${{ matrix.target_arch }}" \
          -DCARES_STATIC=ON -DCARES_SHARED=ON -DCARES_BUILD_TESTS=OFF
        make -j$NCORES && make install
        cd ../..

        # ---- openssl ----
        curl -fsSL https://github.com/openssl/openssl/releases/download/openssl-3.4.6/openssl-3.4.6.tar.gz | tar xz
        cd openssl-3.4.6
        if [ "${{ matrix.target_arch }}" = "x86_64" ]; then
          OS_COMPILER=darwin64-x86_64-cc
        else
          OS_COMPILER=darwin64-arm64-cc
        fi
        echo "Building OpenSSL for $OS_COMPILER"
        ./Configure "$OS_COMPILER" \
          --prefix="$PREFIX" --openssldir="$PREFIX/ssl" \
          no-shared no-tests
        make -j$NCORES
        make install_sw
        echo "OpenSSL built. Checking libs:"
        ls -la "$PREFIX/lib"/libcrypto* "$PREFIX/lib"/libssl* "$PREFIX/lib/pkgconfig/"*.pc 2>/dev/null || echo "WARNING: crypto libs not found"
        cd ..

        # ---- libssh2 ----
        curl -fsSL https://libssh2.org/download/libssh2-1.11.1.tar.gz | tar xz
        cd libssh2-1.11.1
        export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
        export CFLAGS="-arch ${{ matrix.target_arch }} -Os -isysroot $(xcrun --sdk macosx --show-sdk-path) -I$PREFIX/include"
        export LDFLAGS="-arch ${{ matrix.target_arch }} -isysroot $(xcrun --sdk macosx --show-sdk-path) -L$PREFIX/lib"
        export CPPFLAGS="-I$PREFIX/include"
        export LIBS="-L$PREFIX/lib -lssl -lcrypto"
        ./configure --enable-static --disable-shared --prefix="$PREFIX" \
          --with-crypto=openssl \
          --with-libssl-prefix="$PREFIX"
        make -j$NCORES && make install
        cd ..

        ls -la "$PREFIX/lib"
    - name: Autoreconf
      working-directory: ${{ env.FLUXCORE_DIR }}
      env:
        PREFIX: /tmp/flux-deps-${{ matrix.arch }}
      run: |
        rm -rf autom4te.cache
        rm -f configure
        export ACLOCAL_PATH="$(pwd)/m4:$PREFIX/share/aclocal"
        aclocal -I m4
        autopoint --force
        autoreconf -fi -I m4
    - name: Verify configure
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        if grep -n "ARIA2_ARG_WITH" configure; then
          exit 1
        fi
    - name: Configure
      working-directory: ${{ env.FLUXCORE_DIR }}
      env:
        PREFIX: /tmp/flux-deps-${{ matrix.arch }}
      run: |
        export CFLAGS="-arch ${{ matrix.target_arch }} -Os -ffunction-sections -fdata-sections -I$PREFIX/include"
        export CXXFLAGS="-arch ${{ matrix.target_arch }} -Os -ffunction-sections -fdata-sections -I$PREFIX/include"
        export LDFLAGS="-arch ${{ matrix.target_arch }} -Wl,-dead_strip -L$PREFIX/lib -Wl,-rpath,$PREFIX/lib"
        export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
        ./configure \
          --without-openssl --without-gnutls --with-appletls \
          --with-libcares \
          --with-libssh2 \
          --with-sqlite3 \
          --with-libexpat \
          --with-libz \
          --without-libxml2 \
          --disable-nls \
          ARIA2_STATIC=no
    - name: Build
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        make -j"$(sysctl -n hw.ncpu)"
        strip -x src/fluxcore || true
    - name: Verify binary
      working-directory: ${{ env.FLUXCORE_DIR }}
      env:
        PREFIX: /tmp/flux-deps-${{ matrix.arch }}
      run: |
        file src/fluxcore
        # Set DYLD_LIBRARY_PATH for runtime library discovery
        export DYLD_LIBRARY_PATH="$PREFIX/lib:$DYLD_LIBRARY_PATH"
        if [ "${{ matrix.arch }}" = "x64" ]; then
          echo "x64 cross-compiled binary, cannot run on arm64 host. Skipping -v check."
          file src/fluxcore | grep -q "x86_64" || { echo "ERROR: not x86_64"; exit 1; }
        else
          # Check what libraries are linked
          otool -L src/fluxcore
          # Try to run the binary
          ./src/fluxcore -v
        fi
    - name: Collect macOS runtime libs
      shell: bash
      env:
        PREFIX: /tmp/flux-deps-${{ matrix.arch }}
      run: |
        set -euo pipefail
        OUT_DIR="dist/FluxCore-macos-${{ matrix.arch }}"
        BIN_PATH="${{ env.FLUXCORE_DIR }}/src/fluxcore"
        mkdir -p "$OUT_DIR/lib"
        cp -v "$BIN_PATH" "$OUT_DIR/fluxcore"
        chmod +x "$OUT_DIR/fluxcore" || true

        # Bundle libs from our prefix AND from /opt/homebrew (for native arm64 build)
        should_bundle () {
          local p="$1"
          [[ "$p" == /opt/homebrew/* ]] || [[ "$p" == /usr/local/* ]] || [[ "$p" == "$PREFIX"/* ]]
        }

        queue=("$OUT_DIR/fluxcore")
        idx=0
        while [ $idx -lt ${#queue[@]} ]; do
          f="${queue[$idx]}"
          idx=$((idx + 1))
          while IFS= read -r dep; do
            [ -z "$dep" ] && continue
            if should_bundle "$dep" && [ -f "$dep" ]; then
              base="$(basename "$dep")"
              dest="$OUT_DIR/lib/$base"
              if [ ! -f "$dest" ]; then
                cp -Lv "$dep" "$dest"
                chmod 755 "$dest" || true
                queue+=("$dest")
              fi
            fi
          done < <(otool -L "$f" | tail -n +2 | awk '{print $1}')
        done

        # Rewrite dylib references to relative paths.
        for f in "$OUT_DIR/fluxcore" "$OUT_DIR"/lib/*; do
          [ -f "$f" ] || continue
          while IFS= read -r dep; do
            [ -z "$dep" ] && continue
            base="$(basename "$dep")"
            localRefExe="@executable_path/lib/$base"
            localRefDylib="@loader_path/$base"
            if [ -f "$OUT_DIR/lib/$base" ]; then
              if [[ "$f" == "$OUT_DIR/fluxcore" ]]; then
                install_name_tool -change "$dep" "$localRefExe" "$f" || true
              else
                install_name_tool -change "$dep" "$localRefDylib" "$f" || true
              fi
            fi
          done < <(otool -L "$f" | tail -n +2 | awk '{print $1}')
          if [[ "$f" == "$OUT_DIR"/lib/* ]]; then
            install_name_tool -id "@loader_path/$(basename "$f")" "$f" || true
          fi
        done

        ls -la "$OUT_DIR"
        ls -la "$OUT_DIR/lib" || true
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FluxCore-macos-${{ matrix.arch }}
        path: dist/FluxCore-macos-${{ matrix.arch }}

  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msystem: MINGW64
            mingw_dir: mingw64
            host: x86_64-w64-mingw32
            packages: >-
              mingw-w64-x86_64-toolchain
              autoconf
              automake
              libtool
              pkg-config
              make
              gettext
              gettext-devel
              xz
              mingw-w64-x86_64-openssl
              mingw-w64-x86_64-libssh2
              mingw-w64-x86_64-sqlite3
              mingw-w64-x86_64-expat
              mingw-w64-x86_64-gmp
              mingw-w64-x86_64-zlib
              mingw-w64-x86_64-cmake
              wget
    steps:
    - uses: actions/checkout@v6
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: true
        install: ${{ matrix.packages }}
    - name: Detect source directory
      shell: msys2 {0}
      run: |
        if [ -f "configure.ac" ] && [ -d "src" ]; then
          echo "FLUXCORE_DIR=." >> $GITHUB_ENV
        elif [ -f "FluxCore/configure.ac" ] && [ -d "FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore" >> $GITHUB_ENV
        elif [ -f "FluxCore/FluxCore/configure.ac" ] && [ -d "FluxCore/FluxCore/src" ]; then
          echo "FLUXCORE_DIR=FluxCore/FluxCore" >> $GITHUB_ENV
        else
          exit 1
        fi
    - name: Install c-ares 1.34.6
      shell: msys2 {0}
      run: |
        # Check if MSYS2 c-ares is sufficient
        if pkg-config --exists libcares && pkg-config --atleast-version=1.34.0 libcares; then
          echo "MSYS2 c-ares version is sufficient"
          pkg-config --modversion libcares
        else
          echo "Building c-ares 1.34.6 from source"
          wget https://github.com/c-ares/c-ares/releases/download/v1.34.6/c-ares-1.34.6.tar.gz
          tar xzf c-ares-1.34.6.tar.gz
          cd c-ares-1.34.6
          mkdir build && cd build
          cmake .. \
            -G "MSYS Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/${{ matrix.mingw_dir }} \
            -DCARES_STATIC=ON \
            -DCARES_SHARED=ON \
            -DCARES_BUILD_TESTS=OFF
          make -j$(nproc)
          make install
          cd ../..
          rm -rf c-ares-1.34.6 c-ares-1.34.6.tar.gz
        fi
        # Verify installation
        pkg-config --modversion libcares
        pkg-config --cflags libcares
        pkg-config --libs libcares
    - name: Autoreconf
      shell: msys2 {0}
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        rm -rf autom4te.cache
        rm -f configure
        export ACLOCAL_PATH="$(pwd)/m4"
        aclocal -I m4
        if [ ! -f ./config.rpath ] && [ -f /usr/share/gettext/config.rpath ]; then
          cp /usr/share/gettext/config.rpath ./config.rpath
        fi
        if [ ! -f ./config.rpath ]; then
          ap="$(command -v autopoint || true)"
          if [ -n "$ap" ]; then
            p="$(cd "$(dirname "$ap")/.." && pwd)/share/gettext/config.rpath"
            if [ -f "$p" ]; then
              cp "$p" ./config.rpath
            fi
          fi
        fi
        autoreconf -fi -I m4
    - name: Verify configure
      shell: msys2 {0}
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        if grep -n "ARIA2_ARG_WITH" configure; then
          exit 1
        fi
    - name: Configure
      shell: msys2 {0}
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        ./configure \
          --host=${{ matrix.host }} \
          --without-included-gettext \
          --disable-nls \
          --with-libcares \
          --without-gnutls \
          --without-wintls \
          --with-openssl \
          --with-sqlite3 \
          --without-libxml2 \
          --with-libexpat \
          --with-libz \
          --with-libgmp \
          --with-libssh2 \
          --without-libgcrypt \
          --without-libnettle \
          --disable-dependency-tracking \
          ARIA2_STATIC=yes \
          CFLAGS="-Os -ffunction-sections -fdata-sections" \
          CXXFLAGS="-Os -ffunction-sections -fdata-sections" \
          CPPFLAGS="-I/${{ matrix.mingw_dir }}/include" \
          LDFLAGS="-Wl,--gc-sections -L/${{ matrix.mingw_dir }}/lib" \
          LIBS="-lcrypt32" \
          PKG_CONFIG_PATH="/${{ matrix.mingw_dir }}/lib/pkgconfig"
    - name: Build
      shell: msys2 {0}
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        make -j"$(nproc)"
        strip -s src/fluxcore.exe || true
    - name: Verify binary
      shell: msys2 {0}
      working-directory: ${{ env.FLUXCORE_DIR }}
      run: |
        ./src/fluxcore.exe -v
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FluxCore-windows-${{ matrix.arch }}
        path: ${{ env.FLUXCORE_DIR }}/src/fluxcore.exe
